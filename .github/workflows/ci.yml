---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # --- Tests: se construye SOLO la etapa "test" del Dockerfile ---
      - name: Construir la imagen de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          provenance: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      # El contenedor corre los tests y termina con codigo 1 si falla algun
      # test o si la cobertura queda por debajo del umbral. Eso rompe el job.
      - name: Correr tests y verificar cobertura (backend)
        run: |
          mkdir -p TestResults
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci

      # if: !cancelled() => se ejecuta aunque los tests hayan fallado,
      # que es justo cuando mas sirve ver el reporte.
      - name: Publicar resumen de cobertura (backend)
        if: ${{ !cancelled() }}
        run: |
          if [ -f TestResults/resumen.md ]; then
            cat TestResults/resumen.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir reporte de cobertura (backend)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-backend
          path: TestResults/
          if-no-files-found: warn

      # --- Publicar: SOLO llega acá si todo lo anterior salió en verde ---
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # --- Tests ---
      - name: Construir la imagen de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          provenance: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests y verificar cobertura (frontend)
        run: |
          mkdir -p coverage-frontend
          docker run --rm \
            -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/coverage-frontend:/salida" \
            frontend-test:ci

      - name: Publicar resumen de cobertura (frontend)
        if: ${{ !cancelled() }}
        run: |
          RESUMEN=coverage-frontend/reporte/coverage-summary.json
          if [ ! -f "$RESUMEN" ]; then
            echo "::error::No se genero $RESUMEN (¿fallaron los tests antes de medir cobertura?)"
            exit 1
          fi
          # Si el alcance quedara vacio, 0/0 podria pasar el umbral sin medir nada.
          if [ "$(jq '.total.lines.total' "$RESUMEN")" -eq 0 ]; then
            echo "::error::La cobertura mide 0 lineas: el alcance quedo vacio"
            exit 1
          fi
          {
            echo "### Cobertura del frontend"
            echo
            echo "| Metrica | Cobertura |"
            echo "|---|---|"
            echo "| Lineas | $(jq '.total.lines.pct' "$RESUMEN")% |"
            echo "| Ramas | $(jq '.total.branches.pct' "$RESUMEN")% |"
            echo "| Funciones | $(jq '.total.functions.pct' "$RESUMEN")% |"
            echo "| Sentencias | $(jq '.total.statements.pct' "$RESUMEN")% |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de cobertura (frontend)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-frontend
          path: coverage-frontend/reporte/
          if-no-files-found: warn

      # --- Publicar: SOLO llega acá si todo lo anterior salió en verde ---
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # --- Promocion a QA: arranca donde termina la verificacion ---
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; solo main despliega
    environment: qa
    steps:
      # El hook ya no dice QUE COMMIT construir sino QUE IMAGEN ejecutar: la misma
      # que publico el job de build de esta corrida (sha-<commit completo>). Render
      # no reconstruye nada. El hook ya trae ?key=..., por eso --get agrega imgURL
      # con & y codifica los ':' y '/'. La URL del hook va ULTIMA: es el unico
      # argumento suelto y --data-urlencode se lleva el valor que tiene al lado.
      - name: Desplegar en QA la IMAGEN del commit (backend + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          echo "Imagen API:   $IMG_API"
          echo "Imagen front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      # Reintenta: el free tier incluye el build de Render + cold start.
      # Verifica tres cosas: proceso vivo (/health), base respondiendo
      # (/api/gastos) y front servido.
      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://gastos-api-qa-r6ig.onrender.com
          URL_FRONT: https://gastos-front-qa-ez08.onrender.com
        run: |
          echo "Esperando a que QA corra el commit $GITHUB_SHA ..."
          for i in $(seq 1 30); do
            SALUD=$(curl -fsS --max-time 10 "$URL_API/health" || true)
            echo "intento $i - /health: ${SALUD:-sin respuesta}"
            if echo "$SALUD" | grep -q "\"commit\":\"$GITHUB_SHA\"" \
               && curl -fsS --max-time 10 "$URL_API/api/gastos" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "QA corre el commit verificado (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "QA no corre el commit $GITHUB_SHA a tiempo"; exit 1

  # --- Promocion a PROD: pasa por la compuerta humana ---
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa                           # PROD solo despues de QA vivo (y hereda el if de la rama)
    environment: production                    # el workflow SE PAUSA aca hasta que alguien apruebe
    concurrency:
      group: deploy-prod                       # dos deploys a PROD nunca se pisan
      cancel-in-progress: false
    steps:
      # Entre que la corrida queda esperando aprobacion y que alguien la aprueba pueden
      # pasar horas y main se mueve. El imgURL lleva el sha de ESTA corrida: PROD recibe
      # la misma imagen que QA y las pruebas verificaron, no lo ultimo que haya.
      - name: Desplegar en PROD la MISMA imagen que verifico QA (backend + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          echo "Imagen API:   $IMG_API"
          echo "Imagen front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: https://gastos-api-prod-fvsa.onrender.com
          URL_FRONT: https://gastos-front-prod-96km.onrender.com
        run: |
          echo "Esperando a que PROD corra el commit $GITHUB_SHA ..."
          for i in $(seq 1 30); do
            SALUD=$(curl -fsS --max-time 10 "$URL_API/health" || true)
            echo "intento $i - /health: ${SALUD:-sin respuesta}"
            if echo "$SALUD" | grep -q "\"commit\":\"$GITHUB_SHA\"" \
               && curl -fsS --max-time 10 "$URL_API/api/gastos" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "PROD corre el commit verificado (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "PROD no corre el commit $GITHUB_SHA a tiempo"; exit 1
